<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/popup.css">
  <title>Forget & Focus</title>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1 data-i18n="appName">Forget & Focus</h1>
    <p class="tagline" data-i18n="tagline">Forget Tabs, Focus on Tasks.</p>
  </header>

  <!-- Plan indicator -->
  <div id="plan-indicator" class="plan-indicator plan-free">
    <span id="plan-label">Free</span>
  </div>

  <!-- Idle tabs section -->
  <section class="section">
    <div class="section-header">
      <h2 data-i18n="idleTabs">放置中のタブ</h2>
      <button id="btn-refresh" class="btn-secondary btn-sm" data-i18n="refresh">更新</button>
    </div>
    <div id="idle-tabs-list" class="tab-list">
      <p class="text-secondary" data-i18n="loading">読み込み中...</p>
    </div>
  </section>

  <!-- Actions -->
  <section class="actions">
    <button id="btn-archive-selected" class="btn-primary" disabled data-i18n="archiveSelected">
      選択したタブを忘却する
    </button>
    <button id="btn-archive-all" class="btn-secondary" data-i18n="archiveAll">
      すべて忘却する
    </button>
  </section>

  <!-- AI Summary banner (Pro only) -->
  <div id="pro-banner" class="pro-banner hidden">
    <span class="badge badge-pro" data-i18n="proLabel">Pro</span>
    <span id="pro-banner-text" data-i18n="aiSummaryLocked">AI忘却メモはPro版限定機能です</span>
  </div>

  <!-- Recent archives -->
  <section class="section">
    <div class="section-header">
      <h2 data-i18n="recentArchives">最近の忘却録</h2>
      <button id="btn-export" class="btn-secondary btn-sm" data-i18n="exportMd">MD出力</button>
    </div>
    <div id="archives-list" class="archive-list">
      <p class="text-secondary" data-i18n="noArchives">アーカイブはまだありません</p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <a href="options.html" id="link-options" data-i18n="settingsLink">設定</a>
  </footer>

  <script src="src/popup.js" type="module"></script>
</body>
</html>
