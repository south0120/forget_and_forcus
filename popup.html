<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/common.css">
  <link rel="stylesheet" href="styles/popup.css">
  <title>Forget & Focus</title>
</head>
<body>
  <!-- Quote of the moment -->
  <div class="quote-bar">
    <p id="quote"></p>
  </div>

  <!-- Header -->
  <header class="header">
    <h1 data-i18n="appName">Forget & Focus</h1>
    <p class="tagline" data-i18n="tagline">明日に回すな。今日を生きろ。</p>
  </header>

  <!-- The Countdown — central dramatic element -->
  <section class="doom-section">
    <div class="doom-count" id="doom-count">0</div>
    <div class="doom-label" id="doom-label" data-i18n="tabsDoomed">個のタブが忘却される</div>
  </section>

  <!-- Doomed tab list -->
  <section class="doomed-list-section">
    <div id="doomed-tabs" class="doomed-list"></div>
  </section>

  <!-- The Button — one big, decisive action -->
  <section class="action-section">
    <button id="btn-forget" class="btn-forget" disabled data-i18n="forgetAll">
      全部捨てろ
    </button>
  </section>

  <!-- Pro banner (Free users only) -->
  <div id="pro-banner" class="pro-banner hidden">
    <span id="pro-banner-text" data-i18n="proBannerFree">忘れた記憶にAIが意味を与える。</span>
    <a href="#" id="pro-link" data-i18n="proUnlock">Pro版で忘却メモを解放する</a>
  </div>

  <!-- Recent oblivion log -->
  <section class="archive-section">
    <div class="section-header">
      <h2 data-i18n="archiveTitle">忘却録</h2>
      <button id="btn-export" class="btn-ghost" data-i18n="archiveExport">記録を持ち出す</button>
    </div>
    <div id="archives-list" class="archive-list">
      <p class="empty-text" data-i18n="archiveEmpty">まだ何も手放していない。</p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <a href="options.html" id="link-options" data-i18n="settingsTitle">ルール</a>
  </footer>

  <script src="src/popup.js" type="module"></script>
</body>
</html>
